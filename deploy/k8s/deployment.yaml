apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-recsys
  labels:
    app: mini-recsys
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mini-recsys
  template:
    metadata:
      labels:
        app: mini-recsys
    spec:
      containers:
        - name: mini-recsys
          image: mini-recsys:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: mini-recsys-config
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: models
              mountPath: /models
              readOnly: true
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mini-recsys-data
        - name: models
          persistentVolumeClaim:
            claimName: mini-recsys-models
