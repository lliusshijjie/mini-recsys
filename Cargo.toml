[package]
name = "mini-recsys"
version = "0.1.0"
edition = "2021"
description = "A hybrid Rust/C++ recommendation system demo for learning purposes"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
rand = "0.8"
tower-http = { version = "0.5", features = ["cors"] }
sled = "0.34"
bincode = "1.3"
anyhow = "1.0"
fastbloom-rs = "0.5"
ort = { version = "2.0.0-rc.11" }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
ndarray = "0.16"
tantivy = "0.22"

[build-dependencies]
cc = "1.0"
